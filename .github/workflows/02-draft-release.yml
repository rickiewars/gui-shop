name: 02 - draft release

on:
  push:
    tags: [ '*.*.*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'mod_version to verify against'
        required: true

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: resolve tag
        id: resolve
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: verify tag matches mod_version
        run: ./gradlew :verifyTagMatchesVersion -Ptag=${{ steps.resolve.outputs.tag }}

  prepare:
    needs: verify-tag
    runs-on: ubuntu-26.04
    outputs:
      versions: ${{ steps.set-matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@v4

      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: compute version matrix
        id: set-matrix
        run: echo "versions=$(./gradlew -q :printVersions)" >> "$GITHUB_OUTPUT"

  build:
    needs: [ verify-tag, prepare ]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.versions) }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: setup jdk ${{ matrix.java_version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java_version }}
          distribution: 'temurin'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: verify loader floor compatibility
        run: ./gradlew :${{ matrix.minecraft_version }}:verifyFabricLoaderBackwardCompatibility

      - name: build and test
        run: ./gradlew :${{ matrix.minecraft_version }}:build

      - name: capture jar
        uses: actions/upload-artifact@v4
        with:
          name: gui-shop-${{ needs.verify-tag.outputs.tag }}+${{ matrix.minecraft_version }}
          path: versions/${{ matrix.minecraft_version }}/build/libs/gui-shop-${{ needs.verify-tag.outputs.tag }}+${{ matrix.minecraft_version }}.jar

  create-release:
    needs: [ verify-tag, prepare, build ]
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: download all jars
        uses: actions/download-artifact@v4
        with:
          pattern: gui-shop-*
          path: dist
          merge-multiple: true

      # Assets are added in order of targeted Minecraft version, newest first
      - name: create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
          VERSIONS_JSON: ${{ needs.prepare.outputs.versions }}
        run: |
          set -euo pipefail
          mapfile -t mc_versions < <(jq -r '[.[].minecraft_version] | reverse | .[]' <<< "$VERSIONS_JSON")
          files=()
          for mc_version in "${mc_versions[@]}"; do
            files+=("dist/gui-shop-${TAG}+${mc_version}.jar")
          done
          gh release create "$TAG" --draft --title "$TAG" --generate-notes "${files[@]}"
