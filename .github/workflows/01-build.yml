name: 01 - build
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      versions: ${{ steps.set-matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@v4

      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'

      - name: setup gradle from cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: compute version matrix
        id: set-matrix
        run: echo "versions=$(./gradlew -q :printVersions)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.versions) }}
    runs-on: ubuntu-26.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk ${{ matrix.java_version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java_version }}
          distribution: 'temurin'

      - name: setup gradle from main's warm cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: verify Fabric loader minimum version compatibility
        run: ./gradlew :${{ matrix.minecraft_version }}:verifyFabricLoaderBackwardCompatibility

      - name: build and test
        run: ./gradlew :${{ matrix.minecraft_version }}:build

      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui-shop-${{ matrix.minecraft_version }}
          path: versions/${{ matrix.minecraft_version }}/build/libs/
