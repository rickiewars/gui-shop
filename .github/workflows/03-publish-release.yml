name: 03 - publish release

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Test flow based on tag and upload to temporary modrinth project for testing purposes'
        required: true

jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      versions: ${{ steps.set-matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: compute version matrix
        id: set-matrix
        run: echo "versions=$(./gradlew -q :printVersions)" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.versions) }}
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: download jar from release
        run: gh release download "${{ github.event.release.tag_name || inputs.tag }}" --pattern "gui-shop-${{ github.event.release.tag_name || inputs.tag }}+${{ matrix.minecraft_version }}.jar" --dir dist

      - name: publish to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          # fsywSq9M is real project
          # YpRhdSNo is temporary test project
          project: ${{ github.event_name == 'release' && 'fsywSq9M' || 'YpRhdSNo' }}
          name: ${{ github.event.release.name || format('test run {0}', inputs.tag) }} (${{ matrix.minecraft_version }})
          version: ${{ github.event.release.tag_name || inputs.tag }}+${{ matrix.minecraft_version }}
          status: listed
          loaders: fabric
          game-versions: ${{ matrix.minecraft_version }}
          changelog: ${{ github.event.release.body || 'Manual test run via workflow_dispatch.' }}
          files: dist/gui-shop-${{ github.event.release.tag_name || inputs.tag }}+${{ matrix.minecraft_version }}.jar
