name: 03 - publish release

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Test flow based on tag and upload to temporary modrinth project for testing purposes'
        required: true

# TODO: revert to contents: read once workflow_dispatch (the test-only trigger) is removed.
# write is only needed for gh release download's draft-release lookup, used by workflow_dispatch
# test runs against a still-draft release; the real release: published path only needs read.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      RELEASE_NAME: ${{ github.event.release.name || format('test run {0}', inputs.tag) }}
      RELEASE_BODY: ${{ github.event.release.body || 'Manual test run via workflow_dispatch.' }}
      # fsywSq9M is the real project, YpRhdSNo is the temporary test project
      MODRINTH_PROJECT: ${{ github.event_name == 'release' && 'fsywSq9M' || 'YpRhdSNo' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: compute version list
        run: |
          mkdir -p assets
          ./gradlew -q :printVersions > assets/manifest.json

      - name: download release assets
        run: gh release download "${TAG}" --dir assets

      - name: publish each version to Modrinth in order
        env:
          ASSETS_DIR: ${{ github.workspace }}/assets
        run: bash .github/scripts/publish-modrinth.sh
