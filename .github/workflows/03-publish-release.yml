name: 03 - publish release

on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      TAG: ${{ github.event.release.tag_name }}
      RELEASE_NAME: ${{ github.event.release.name }}
      RELEASE_BODY: ${{ github.event.release.body }}
      MODRINTH_PROJECT: fsywSq9M
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: compute version list
        run: |
          mkdir -p assets
          ./gradlew -q :printVersions > assets/manifest.json

      - name: download release assets
        run: gh release download "${TAG}" --dir assets

      - name: publish each version to Modrinth in order
        env:
          ASSETS_DIR: ${{ github.workspace }}/assets
        run: bash .github/scripts/publish-modrinth.sh
