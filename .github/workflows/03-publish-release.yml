name: 03 - publish release

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Test flow based on tag and upload to temporary modrinth project for testing purposes'
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      RELEASE_NAME: ${{ github.event.release.name || format('test run {0}', inputs.tag) }}
      RELEASE_BODY: ${{ github.event.release.body || 'Manual test run via workflow_dispatch.' }}
      # fsywSq9M is the real project, YpRhdSNo is the temporary test project
      MODRINTH_PROJECT: ${{ github.event_name == 'release' && 'fsywSq9M' || 'YpRhdSNo' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: compute version list
        id: versions
        run: echo "versions=$(./gradlew -q :printVersions)" >> "$GITHUB_OUTPUT"

      - name: publish each version to Modrinth in order
        env:
          VERSIONS_JSON: ${{ steps.versions.outputs.versions }}
        run: bash .github/scripts/publish-modrinth.sh
