# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Max versions built/tested at once, to avoid tanking your CPU. Override with --max-workers=N.
org.gradle.workers.max=2
# Only configures the Stonecutter subprojects a task actually needs, instead of all of them.
org.gradle.configureondemand=true

# Silences Stonecutter's Groovy-vs-Kotlin DSL warning.
# Switching to Kotlin DSL is still under consideration.
dev.kikugie.stonecutter.hard_mode=true

# loader_version: latest, used for development to see all available loader API.
loader_version=0.19.5
# loader_version_floor: enforced minimum, only bumped when code needs a newer loader API.
loader_version_floor=0.18.1
loom_version=1.17-SNAPSHOT
# Default, since every version from 26.1 onward is unobfuscated. Older versions override this
# to false in their own gradle.properties.
fabric.loom.disableObfuscation=true

# Mod Dependencies
sqlite_version=3.36.0.3

# For Unit Testing
# See the [fabric-loader-unit maven artifacts](https://mvnrepository.com/artifact/net.fabricmc/fabric-loader-junit)
# Select the version that matches the loader version (https://mvnrepository.com/artifact/net.fabricmc/fabric-loader-junit/<loader_version>)
# Check the runtime dependencies for the required platform version
junit_version=5.10.0
junit_platform_version=1.10.0

# Mod Properties
mod_version=2.1.0
maven_group=rickiewars.guishop
archives_base_name=gui-shop
